[package]
name = "tauri-di-viewer"
version = "1.1.23"
description = "DI-Viewer Tauri Edition"
authors = ["Yin"]
edition = "2021"

[features]
# Emit the embedded-resource build (WebviewUrl::App served from the bundled
# assets) instead of pointing the window at the dev server. Release builds
# must pass --features custom-protocol;  does that for us.
default = []
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `unstable` is what exposes `Window::add_child` — the only way to put several
# webviews inside one native window, which is what a tab strip actually is.
# Each tab keeps its own document (no reload on switch) but there is a single
# OS window, so opacity / always-on-top / geometry apply once, not per tab.
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
url = "2"

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging"
] }
