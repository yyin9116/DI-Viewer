<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DI-Viewer Control</title>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <main class="app">
      <header class="top">
        <div>
          <h1 data-i18n="app.title">DI-Viewer</h1>
          <p id="status">Ready</p>
        </div>
        <div class="toolbar-row">
          <label for="langSelect" data-i18n="app.language">Language</label>
          <select id="langSelect">
            <option value="zh">中文</option>
            <option value="en">English</option>
          </select>
          <button id="runDiagnosticsBtn" data-i18n="app.diagnostics">Run Diagnostics</button>
        </div>
      </header>

      <section class="card">
        <h2 data-i18n="panel.window">Window</h2>
        <label for="urlInput" data-i18n="window.address">Address</label>
        <div class="row">
          <input id="urlInput" type="text" placeholder="https://limestart.cn/" />
          <button id="goBtn" data-i18n="window.go">Go</button>
        </div>
        <div class="row wrap">
          <button id="homeBtn" data-i18n="window.home">Home</button>
          <button id="showHideBtn">Show/Hide</button>
          <button id="insideBtn">Inside</button>
          <button id="onTopBtn">OnTop</button>
          <button id="sidebarBtn">Sidebar</button>
          <button id="minBtn" data-i18n="window.minimize">Minimize</button>
          <button id="maxBtn" data-i18n="window.maxRestore">Max/Restore</button>
          <button id="closeBtn" class="danger" data-i18n="window.exit">Exit</button>
        </div>
        <div class="row">
          <label for="opacityRange" data-i18n="window.opacity">Opacity</label>
          <input id="opacityRange" type="range" min="0.2" max="1" step="0.05" />
          <span id="opacityLabel">1.00</span>
        </div>
      </section>

      <section class="card">
        <h2 data-i18n="panel.media">Media</h2>
        <div class="row wrap">
          <button data-action="toggle_play_pause" data-i18n="media.playPause">Play/Pause</button>
          <button data-action="video_backward" data-i18n="media.backward">-5s</button>
          <button data-action="video_forward" data-i18n="media.forward">+5s</button>
          <button data-action="request_full_screen" data-i18n="media.fullscreen">Fullscreen</button>
        </div>
      </section>

      <section class="card">
        <h2 data-i18n="panel.shortcuts">Shortcuts</h2>
        <p class="hint" data-i18n="shortcuts.hint">Format examples: Alt+Space, Ctrl+Q, Backquote.</p>
        <div id="hotkeyForm" class="grid"></div>
        <div class="row wrap">
          <button id="saveHotkeysBtn" data-i18n="shortcuts.save">Save Hotkeys</button>
          <button id="resetHotkeysBtn" data-i18n="shortcuts.reset">Reset</button>
        </div>
      </section>

      <section class="card">
        <h2 data-i18n="panel.diagnostics">Diagnostics</h2>
        <p class="hint" data-i18n="diagnostics.hint">Checks button actions, opacity, and hotkey registration.</p>
        <ul id="diagnosticsList" class="diag-list"></ul>
      </section>
    </main>
  </body>
</html>
