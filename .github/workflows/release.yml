name: Build And Release (Multi Platform)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
            platform_name: Windows
          - os: ubuntu-22.04
            bundle: appimage,deb
            platform_name: Linux
          - os: macos-latest
            bundle: dmg
            platform_name: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tauri-di-viewer/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        run: choco install nsis -y

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: tauri-di-viewer
        run: npm ci

      - name: Build and publish release artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: tauri-di-viewer
          args: --bundles ${{ matrix.bundle }}
          tagName: ${{ github.ref_name }}
          releaseName: DI-Viewer ${{ github.ref_name }}
          releaseBody: |
            Automated release for DI-Viewer.
            Included platforms:
            - Windows (NSIS installer)
            - Linux (AppImage + deb)
            - macOS (dmg)
          releaseDraft: false
          prerelease: false
