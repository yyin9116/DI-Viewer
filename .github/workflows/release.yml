name: Desktop Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            nsis_glob: tauri-di-viewer/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            msi_glob: tauri-di-viewer/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          - name: macos-arm64
            os: macos-14
            rust_target: aarch64-apple-darwin
            tauri_args: --bundles dmg --target aarch64-apple-darwin
            dmg_glob: tauri-di-viewer/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tauri-di-viewer/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install frontend dependencies
        working-directory: tauri-di-viewer
        run: npm ci

      - name: Install Windows packaging dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis wixtoolset -y
          $nsisPath = "${env:ProgramFiles(x86)}\NSIS"
          if (Test-Path $nsisPath) {
            Add-Content -Path $env:GITHUB_PATH -Value $nsisPath
          }
          $wixPath = "${env:ProgramFiles(x86)}\WiX Toolset v3.11\bin"
          if (Test-Path $wixPath) {
            Add-Content -Path $env:GITHUB_PATH -Value $wixPath
          }

      - name: Enable VBSCRIPT (required for MSI on some runners)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dism /online /Enable-Feature /FeatureName:VBSCRIPT /All /NoRestart

      - name: Build desktop bundle (Windows)
        if: runner.os == 'Windows'
        working-directory: tauri-di-viewer
        shell: cmd
        run: npm run tauri build -- --verbose --bundles nsis,msi --target x86_64-pc-windows-msvc

      - name: Build desktop bundle
        if: runner.os != 'Windows'
        working-directory: tauri-di-viewer
        run: npm run tauri build -- --verbose ${{ matrix.tauri_args }}

      - name: Stage Windows assets
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "release-assets" | Out-Null

          $nsis = Get-ChildItem -Path "${{ matrix.nsis_glob }}" -File | Select-Object -First 1
          if (-not $nsis) {
            throw "NSIS executable not found by: ${{ matrix.nsis_glob }}"
          }
          Copy-Item -Path $nsis.FullName -Destination "release-assets/DI-Viewer-${{ github.ref_name }}-windows-x64.exe"

          $msi = Get-ChildItem -Path "${{ matrix.msi_glob }}" -File | Select-Object -First 1
          if (-not $msi) {
            throw "MSI package not found by: ${{ matrix.msi_glob }}"
          }
          Copy-Item -Path $msi.FullName -Destination "release-assets/DI-Viewer-${{ github.ref_name }}-windows-x64.msi"

      - name: Stage macOS dmg asset
        if: runner.os == 'macOS'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "release-assets" | Out-Null
          $files = Get-ChildItem -Path "${{ matrix.dmg_glob }}" -File
          if (-not $files) {
            throw "No bundle files found by: ${{ matrix.dmg_glob }}"
          }
          $dmg = $files | Select-Object -First 1
          Copy-Item -Path $dmg.FullName -Destination "release-assets/DI-Viewer-${{ github.ref_name }}-macos-arm64.dmg"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.name }}
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          merge-multiple: true
          path: release-assets

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum * > SHA256SUMS

      - name: Resolve release notes
        id: release_notes
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          notes_file="docs/releases/${tag}.md"
          if [[ -f "${notes_file}" ]]; then
            notes="$(cat "${notes_file}")"
          else
            notes=$'Automated desktop release.\n\nIncluded artifacts:\n- Windows x64 (exe installer)\n- Windows x64 (msi installer)\n- macOS arm64 (dmg)\n- SHA256SUMS'
          fi

          delim="$(uuidgen)"
          {
            echo "body<<${delim}"
            echo "${notes}"
            echo "${delim}"
          } >> "${GITHUB_OUTPUT}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DI-Viewer ${{ github.ref_name }}
          body: ${{ steps.release_notes.outputs.body }}
          files: |
            release-assets/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
