<!-- DI-Viewer injected UI -->
<div class="diviewer-overlay" id="diviewer-overlay"></div>

<div class="diviewer-dock-bar" id="diviewer-dock">
  <button id="diviewer-dockQuickBtn" class="dock-btn dock-item-btn" data-dock="quick" data-tab="0" data-i18n-title="dock.quick">
    <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    <span class="dock-label" data-i18n="dock.quick">Quick</span>
  </button>
  <button id="diviewer-dockNavBtn" class="dock-btn dock-item-btn" data-dock="navigate" data-tab="1" data-i18n-title="dock.navigate">
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    <span class="dock-label" data-i18n="dock.navigate">Navigate</span>
  </button>
  <button id="diviewer-dockMediaBtn" class="dock-btn dock-item-btn" data-dock="media" data-tab="2" data-i18n-title="dock.media">
    <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    <span class="dock-label" data-i18n="dock.media">Media</span>
  </button>
  <button id="diviewer-dockKeysBtn" class="dock-btn dock-item-btn" data-dock="shortcuts" data-tab="3" data-i18n-title="dock.shortcuts">
    <svg viewBox="0 0 24 24"><path d="M20 5H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zM6.5 16C5.67 16 5 15.33 5 14.5S5.67 13 6.5 13 8 13.67 8 14.5 7.33 16 6.5 16zm0-5C5.67 11 5 10.33 5 9.5S5.67 8 6.5 8 8 8.67 8 9.5 7.33 11 6.5 11zM20 9h-9V8h9v1zm-4 3h-5v-1h5v1zm4 3h-9v-1h9v1z"/></svg>
    <span class="dock-label" data-i18n="dock.shortcuts">Shortcuts</span>
  </button>
  <button id="diviewer-dockHelpBtn" class="dock-btn dock-item-btn" data-dock="help" data-tab="4" data-i18n-title="dock.help">
    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/></svg>
    <span class="dock-label" data-i18n="dock.help">Help</span>
  </button>
  <button id="diviewer-bookmarkDockBtn" class="dock-btn dock-item-btn" data-dock="bookmarks" data-tab="1" data-i18n-title="dock.bookmarks">
    <svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
    <span class="dock-label" data-i18n="dock.bookmarks">Bookmarks</span>
  </button>
</div>

    </strong>
    <div class="diviewer-panel-head-actions">
      <label for="diviewer-langSelect" data-i18n="panel.lang">Language</label>
      <select id="diviewer-langSelect">
        <option value="zh">中文</option>
        <option value="en">English</option>
      </select>
    </div>
  </div>

  <div class="diviewer-tab-box">
    <button class="tab-btn active" data-i18n="tab.quick">Quick</button>
    <button class="tab-btn" data-i18n="tab.navigate">Navigate</button>
    <button class="tab-btn" data-i18n="tab.media">Media</button>
    <button class="tab-btn" data-i18n="tab.shortcuts">Shortcuts</button>
    <button class="tab-btn" data-i18n="tab.help">Help</button>
    <div class="diviewer-line"></div>
  </div>

  <div class="diviewer-content-box">
    <div class="content active">
      <div class="diviewer-win-controls">
        <button id="diviewer-homePageBtn"><span data-i18n="quick.home">Home</span></button>
        <button id="diviewer-showHideBtn"><span id="diviewer-showHideLabel" data-i18n="quick.hide">Hide</span></button>
        <button id="diviewer-onTopBtn"><span data-i18n="quick.onTop">On Top</span></button>
        <button id="diviewer-insideModeBtn"><span data-i18n="quick.inside">Inside</span></button>
        <button id="diviewer-opacityDownBtn"><span data-i18n="quick.opacityDown">Opacity-</span></button>
        <button id="diviewer-opacityUpBtn"><span data-i18n="quick.opacityUp">Opacity+</span></button>
        <button id="diviewer-maximizeBtn"><span data-i18n="quick.maxRestore">Max/Restore</span></button>
        <button id="diviewer-minimizeBtn"><span data-i18n="quick.minimize">Minimize</span></button>
        <button id="diviewer-lockPosBtn"><span data-i18n="quick.lock">Lock</span></button>
        <button id="diviewer-closeBtn"><span data-i18n="quick.exit">Exit</span></button>
      </div>

      <div class="diviewer-size-presets">
        <button data-ratio="0.25">1/4</button>
        <button data-ratio="0.333">1/3</button>
        <button data-ratio="0.5">1/2</button>
        <button data-ratio="0.75">3/4</button>
      </div>

      <p class="diviewer-quick-hint" id="diviewer-quickState"></p>
    </div>

    <div class="content">
      <div class="diviewer-search-row">
        <input type="text" class="diviewer-address-input" data-i18n-placeholder="nav.placeholder" placeholder="Type URL...">
        <button id="diviewer-search-button" data-i18n="nav.go">Go</button>
      </div>
      <div class="diviewer-nav-row">
        <button id="diviewer-backBtn" data-i18n="nav.back">Back</button>
        <button id="diviewer-forwardBtn" data-i18n="nav.forward">Forward</button>
        <button id="diviewer-refreshBtn" data-i18n="nav.refresh">Refresh</button>
      </div>
      <div class="diviewer-tab-session">
        <div class="diviewer-tab-session-header">
          <span data-i18n="nav.tabs">Tabs</span>
          <button id="diviewer-newTabBtn" data-i18n="nav.newTab">+ New</button>
        </div>
        <div id="diviewer-session-tab-list" class="diviewer-session-tab-list"></div>
      </div>
      <div class="diviewer-bookmark-section" id="diviewer-bookmarkSection">
        <div class="diviewer-bookmark-header">
          <span data-i18n="nav.bookmarks">Bookmarks</span>
          <button id="diviewer-addBookmarkBtn" data-i18n="nav.addBookmark">+ Save</button>
        </div>
        <div id="diviewer-bookmark-list" class="diviewer-bookmark-list"></div>
      </div>
    </div>

    <div class="content">
      <div class="diviewer-media-grid">
        <button data-video-action="toggle_play_pause" data-i18n="media.playPause">Play/Pause</button>
        <button data-video-action="video_backward" data-i18n="media.backward">-5s</button>
        <button data-video-action="video_forward" data-i18n="media.forward">+5s</button>
        <button data-video-action="request_full_screen" data-i18n="media.fullscreen">Fullscreen</button>
        <button id="diviewer-pipBtn" data-i18n="media.pip">PiP</button>
      </div>
    </div>

    <div class="content">
      <div class="diviewer-settings-row">
        <label for="diviewer-dockColorSelect" data-i18n="key.theme">状态条颜色</label>
        <select id="diviewer-dockColorSelect">
          <option value="amber" data-i18n="theme.amber">Amber</option>
          <option value="blue" data-i18n="theme.blue">Blue</option>
          <option value="green" data-i18n="theme.green">Green</option>
          <option value="rose" data-i18n="theme.rose">Rose</option>
          <option value="slate" data-i18n="theme.slate">Slate</option>
        </select>
      </div>
      <form class="diviewer-key-config-form" id="diviewer-hotkeyForm">
        <label data-i18n="key.playPause">Play/Pause</label>
        <input class="key-config-input" type="text" id="diviewer-togglePlayPause" name="togglePlayPause" placeholder="Backquote">
        <label data-i18n="key.showHide">Show/Hide</label>
        <input class="key-config-input" type="text" id="diviewer-toggleShowHide" name="toggleShowHide" placeholder="0">
        <label data-i18n="key.inside">Inside</label>
        <input class="key-config-input" type="text" id="diviewer-insideMode" name="insideMode" placeholder="P">
        <label data-i18n="key.fullscreen">Fullscreen</label>
        <input class="key-config-input" type="text" id="diviewer-requestFullScreen" name="requestFullScreen" placeholder="O">
        <label data-i18n="key.backward">Backward</label>
        <input class="key-config-input" type="text" id="diviewer-videoBackward" name="videoBackward" placeholder="5">
        <label data-i18n="key.forward">Forward</label>
        <input class="key-config-input" type="text" id="diviewer-videoForward" name="videoForward" placeholder="6">
        <label data-i18n="key.opacityDown">Opacity -</label>
        <input class="key-config-input" type="text" id="diviewer-decreaseOpacity" name="decreaseOpacity" placeholder="7">
        <label data-i18n="key.opacityUp">Opacity +</label>
        <input class="key-config-input" type="text" id="diviewer-increaseOpacity" name="increaseOpacity" placeholder="8">
        <label data-i18n="key.close">Close App</label>
        <input class="key-config-input" type="text" id="diviewer-closeWindow" name="closeWindow" placeholder="Ctrl+Q">
      </form>
      <div class="diviewer-config-actions">
        <button type="button" id="diviewer-saveConfigBtn" class="btn-primary" data-i18n="key.save">Save</button>
        <button type="button" id="diviewer-resetConfigBtn" class="btn-secondary" data-i18n="key.reset">Reset</button>
      </div>
    </div>

    <div class="content">
      <h2 data-i18n="help.title">Tips</h2>
      <ol>
        <li data-i18n="help.1">Dock auto expands on hover and collapses automatically.</li>
        <li data-i18n="help.2">Use Quick tab for window-level actions.</li>
        <li data-i18n="help.3">Use Navigate tab for tabs and bookmarks.</li>
        <li data-i18n="help.4">Use Media tab for playback and fullscreen actions.</li>
        <li data-i18n="help.5">Configure global shortcuts in Shortcuts tab.</li>
      </ol>
    </div>
  </div>
</div>
