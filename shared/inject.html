<!-- DI-Viewer - injected UI -->

<div class="diviewer-overlay" id="diviewer-overlay"></div>

<div class="diviewer-dock-bar" id="diviewer-dock">
  <button id="diviewer-homeBtn" class="dock-btn" title="首页 Home">
    <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span class="dock-label">首页</span>
  </button>
  <button id="diviewer-searchBtn" class="dock-btn" title="导航 Search">
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg><span class="dock-label">导航</span>
  </button>
  <button id="diviewer-setKeyBtn" class="dock-btn" title="快捷键 Shortcuts">
    <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 00-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1115.6 12 3.6 3.6 0 0112 15.6z"/></svg><span class="dock-label">快捷键</span>
  </button>
  <button id="diviewer-helpBtn" class="dock-btn" title="帮助 Help">
    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/></svg><span class="dock-label">帮助</span>
  </button>
  <button id="diviewer-bookmarkDockBtn" class="dock-btn" title="书签 Bookmarks">
    <svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg><span class="dock-label">书签</span>
  </button>
</div>

<div class="diviewer-tab-container" id="diviewer-panel">
  <div class="diviewer-tab-box">
    <button class="tab-btn active">Window</button>
    <button class="tab-btn">Navigate</button>
    <button class="tab-btn">Shortcuts</button>
    <button class="tab-btn">Help</button>
    <div class="diviewer-line"></div>
  </div>

  <div class="diviewer-content-box">
    <div class="content active">
      <div class="diviewer-win-controls">
        <button id="diviewer-homePageBtn" title="Home">
          <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>Home</span>
        </button>
        <button id="diviewer-onTopBtn" title="Always on top">
          <svg viewBox="0 0 24 24"><path d="M16 12V4h1V2H7v2h1v8l-2 2v2h5.2v6h1.6v-6H18v-2l-2-2z"/></svg><span>On Top</span>
        </button>
        <button id="diviewer-pipBtn" title="Picture in picture">
          <svg viewBox="0 0 24 24"><path d="M19 7h-8v6h8V7zm2-4H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H3V5h18v14z"/></svg><span>PiP</span>
        </button>
        <button id="diviewer-insideModeBtn" title="Click-through mode">
          <svg viewBox="0 0 24 24"><path d="M17 1H7c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-2-2-2zm0 18H7V5h10v14zM12.5 8.9l-1 1L13 11.4l-1.5 1.5 1 1L15 11.4l-2.5-2.5z"/></svg><span>Inside</span>
        </button>
        <button id="diviewer-opacityUpBtn" title="Increase opacity">
          <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg><span>Opacity+</span>
        </button>
        <button id="diviewer-opacityDownBtn" title="Decrease opacity">
          <svg viewBox="0 0 24 24"><path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46A11.8 11.8 0 001 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/></svg><span>Opacity-</span>
        </button>
        <button id="diviewer-minimizeBtn" title="Minimize window">
          <svg viewBox="0 0 24 24"><path d="M6 19h12v2H6z"/></svg><span>Min</span>
        </button>
        <button id="diviewer-closeBtn" title="Exit app">
          <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg><span>Exit</span>
        </button>
        <button id="diviewer-lockPosBtn" title="Lock current position">
          <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1s3.1 1.39 3.1 3.1v2z"/></svg><span>Lock</span>
        </button>
      </div>

      <div class="diviewer-size-presets">
        <button data-ratio="0.25">1/4</button>
        <button data-ratio="0.333">1/3</button>
        <button data-ratio="0.5">1/2</button>
        <button data-ratio="0.75">3/4</button>
      </div>
    </div>

    <div class="content">
      <div class="diviewer-search-row">
        <input type="text" class="diviewer-address-input" placeholder="Type URL...">
        <button id="diviewer-search-button">Go</button>
      </div>
      <div class="diviewer-nav-row">
        <button id="diviewer-backBtn"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>Back</button>
        <button id="diviewer-forwardBtn">Forward<svg viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg></button>
        <button id="diviewer-refreshBtn"><svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>Refresh</button>
      </div>
      <div class="diviewer-tab-session">
        <div class="diviewer-tab-session-header">
          <span>Tabs</span>
          <button id="diviewer-newTabBtn" title="New tab">+ New</button>
        </div>
        <div id="diviewer-session-tab-list" class="diviewer-session-tab-list"></div>
      </div>
      <div class="diviewer-bookmark-section">
        <div class="diviewer-bookmark-header">
          <span>Bookmarks</span>
          <button id="diviewer-addBookmarkBtn" title="Save current page">+ Save</button>
        </div>
        <div id="diviewer-bookmark-list" class="diviewer-bookmark-list"></div>
      </div>
    </div>

    <div class="content">
      <form class="diviewer-key-config-form">
        <label>Play/Pause:</label>
        <input class="key-config-input" type="text" id="diviewer-togglePlayPause" name="togglePlayPause" placeholder="`">
        <label>Show/Hide:</label>
        <input class="key-config-input" type="text" id="diviewer-toggleShowHide" name="toggleShowHide" placeholder="0">
        <label>Inside mode:</label>
        <input class="key-config-input" type="text" id="diviewer-insideMode" name="insideMode" placeholder="p">
        <label>Fullscreen:</label>
        <input class="key-config-input" type="text" id="diviewer-requestFullScreen" name="requestFullScreen" placeholder="o">
        <label>Backward:</label>
        <input class="key-config-input" type="text" id="diviewer-videoBackward" name="videoBackward" placeholder="5">
        <label>Forward:</label>
        <input class="key-config-input" type="text" id="diviewer-videoForward" name="videoForward" placeholder="6">
        <label>Opacity -:</label>
        <input class="key-config-input" type="text" id="diviewer-decreaseOpacity" name="decreaseOpacity" placeholder="7">
        <label>Opacity +:</label>
        <input class="key-config-input" type="text" id="diviewer-increaseOpacity" name="increaseOpacity" placeholder="8">
      </form>
      <div class="diviewer-config-actions">
        <button type="button" id="diviewer-saveConfigBtn" class="btn-primary">Save</button>
        <button type="button" id="diviewer-resetConfigBtn" class="btn-secondary">Reset</button>
      </div>
    </div>

    <div class="content">
      <h2>DI-Viewer</h2>
      <ol>
        <li>Single browser window with overlay control panel.</li>
        <li>Ctrl+T: open home in current window.</li>
        <li>Ctrl+W: hide current browser window.</li>
        <li>Window size presets: 1/4, 1/3, 1/2, 3/4.</li>
        <li>Bookmarks: add, remove, persisted.</li>
        <li>Position lock prevents accidental drag.</li>
      </ol>
    </div>
  </div>
</div>
